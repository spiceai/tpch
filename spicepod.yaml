version: v1
kind: Spicepod
name: tpch
datasets:
  - from: s3://spiceai-demo-datasets/tpch/customer/
    name: tpch.customer
    params:
      file_format: parquet
    acceleration:
      enabled: true
      engine: duckdb

  - from: s3://spiceai-demo-datasets/tpch/lineitem/
    name: tpch.lineitem
    params:
      file_format: parquet
    acceleration:
      enabled: true
      engine: duckdb

  - from: s3://spiceai-demo-datasets/tpch/nation/
